<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Data</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    body {
      margin: 0;
    }

    .container {
      width: min(960px, calc(100% - 32px));
      margin: 48px auto;
    }

    h1 {
      margin-bottom: 8px;
      color: #111827;
    }

    .intro {
      margin-top: 0;
      color: #6b7280;
    }

    .card {
      margin-top: 24px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 0.9rem;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .card {
        overflow-x: auto;
      }

      table {
        min-width: 620px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Team Data</h1>
    <p class="intro">A simple static page displaying sample team information.</p>

    <section class="card" aria-label="Team members">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ava Patel</td>
            <td>Project Manager</td>
            <td>ava@example.com</td>
            <td><span class="status">Active</span></td>
          </tr>
          <tr>
            <td>Liam Chen</td>
            <td>Frontend Developer</td>
            <td>liam@example.com</td>
            <td><span class="status">Active</span></td>
          </tr>
          <tr>
            <td>Sofia Garcia</td>
            <td>UI Designer</td>
            <td>sofia@example.com</td>
            <td><span class="status">Active</span></td>
          </tr>
          <tr>
            <td>Noah Williams</td>
            <td>QA Engineer</td>
            <td>noah@example.com</td>
            <td><span class="status">Active</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
